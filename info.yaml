# Tiny Tapeout project information
project:
  title:        "Verified Protocol Emulator"   # Project title (working title)
  author:       "dean"                          # Your name
  discord:      ""                              # Your discord username (optional)
  description:  "Firmware-programmable protocol emulator with an end-to-end verified firmware-to-pins flow"
  language:     "Hardcaml (OCaml) emitted to Verilog"
  clock_hz:     40000000  # fallback variant of decision V2-1 (25 ns); not the chosen clock

  # Jane Street competition allocation: 8x4 (tt-support-tools ihp-sg13cmos5l tile_sizes.yaml,
  # 1724.16 x 710.64 um, commit d66cf179).
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Must be unique on the shuttle (uniqueness not yet checked).
  top_module:  "tt_um_dean_protocol_emulator"

  # List your project's source files here. Source files must be in ./src.
  source_files:
    - "tt_um_dean_protocol_emulator.v"
    - "pemu_core_v1m.v"
    - "sram_256x16_bb.v"

# The pinout of your project. Leave unused pins blank. Assigned once the ISA is fixed.
pinout:
  # Inputs (doc/interface_v1.md section 2)
  ui[0]: "host SPI CS_n"
  ui[1]: "host SPI SCK"
  ui[2]: "host SPI MOSI"
  ui[3]: "reserved (monitor observable)"
  ui[4]: "reserved (monitor observable)"
  ui[5]: "reserved (monitor observable)"
  ui[6]: "reserved (monitor observable)"
  ui[7]: "reserved (monitor observable)"

  # Outputs
  uo[0]: "host SPI MISO"
  uo[1]: "verdict: fail (sticky)"
  uo[2]: "verdict: blame (sticky)"
  uo[3]: "lane 0 xo[0]"
  uo[4]: "lane 0 xo[1]"
  uo[5]: "lane 1 xo[0]"
  uo[6]: "lane 1 xo[1]"
  uo[7]: "any lane faulted"

  # Bidirectional pins: protocol pins shared by the lanes under ownership masks
  uio[0]: "protocol pin 0 (UART TX, USB D+)"
  uio[1]: "protocol pin 1 (UART RX, USB D-)"
  uio[2]: "protocol pin 2 (I2C SCL)"
  uio[3]: "protocol pin 3 (I2C SDA)"
  uio[4]: "protocol pin 4 (SPI CS)"
  uio[5]: "protocol pin 5 (SPI SCLK)"
  uio[6]: "protocol pin 6 (SPI MOSI)"
  uio[7]: "protocol pin 7 (SPI MISO)"

yaml_version: 6
